<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSE(AIML) Login Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1518770660439-4636190af475') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            color: white;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
        }

        .input-box {
            margin: 15px 0;
            text-align: left;
        }

        .input-box label {
            display: block;
            margin-bottom: 5px;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        .input-box input:focus {
            outline: 2px solid #00bcd4;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: #00bcd4;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn:hover {
            background: #0097a7;
        }

        .error {
            color: red;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login Authentication</h2>

    <form id="loginForm">
        <div class="input-box">
            <label>Username</label>
            <input type="text" id="username" required>
            <div class="error" id="userError">Enter username</div>
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" id="password" required minlength="6">
            <div class="error" id="passError">Password must be at least 6 characters</div>
        </div>

        <button type="submit" class="btn">Login</button>
    </form>
</div>

<script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        let username = document.getElementById("username");
        let password = document.getElementById("password");

        let userError = document.getElementById("userError");
        let passError = document.getElementById("passError");

        let valid = true;

        if (username.value.trim() === "") {
            userError.style.display = "block";
            valid = false;
        } else {
            userError.style.display = "none";
        }

        if (password.value.length < 6) {
            passError.style.display = "block";
            valid = false;
        } else {
            passError.style.display = "none";
        }

        if (valid) {
            alert("Login Successful!");
        }
    });
</script>

</body>
</html>
