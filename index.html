<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Authentication</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://images.unsplash.com/photo-1518770660439-4636190af475') no-repeat center center/cover;
}

/* Dark overlay */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
}

/* Login Box */
.login-container {
    position: relative;
    width: 360px;
    padding: 35px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    text-align: center;
    animation: fadeIn 1s ease;
    z-index: 1;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-40px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    color: white;
    margin-bottom: 20px;
}

/* Inputs */
.input-box {
    position: relative;
    margin-bottom: 20px;
}

.input-box input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: white;
}

.input-box label {
    position: absolute;
    top: 12px;
    left: 12px;
    color: #ddd;
    transition: 0.3s;
}

.input-box input:focus + label,
.input-box input:valid + label {
    top: -10px;
    font-size: 12px;
    color: #00eaff;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(45deg, #00c6ff, #3a3e4492);
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px #00c6ff;
}

/* Small Popup */
.popup {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 15px;
    border-radius: 10px;
    color: white;
    display: none;
}

/* BIG Success Popup */
.success-popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.success-box {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    animation: zoomIn 0.5s ease;
}

.success-box h2 {
    color: green;
    margin-bottom: 10px;
}

.success-box p {
    margin-bottom: 20px;
}

.success-box button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #00c853;
    color: white;
    cursor: pointer;
}

@keyframes zoomIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="login-container">
    <h2>Login Authentication</h2>

    <form onsubmit="return validateForm()">

        <div class="input-box">
            <input type="text" id="username" required>
            <label>Username</label>
        </div>

        <div class="input-box">
            <input type="email" id="email" required>
            <label>Email</label>
        </div>

        <div class="input-box">
            <input type="password" id="password" required>
            <label>Password</label>
        </div>

        <div class="input-box">
            <input type="text" id="otp" required>
            <label>Enter OTP</label>
        </div>

        <button type="submit">Login</button>
    </form>
</div>

<!-- Small popup -->
<div class="popup" id="popup"></div>

<!-- BIG Success Popup -->
<div class="success-popup" id="successPopup">
    <div class="success-box">
        <h2>🎉 Login Successful!</h2>
        <p>Welcome to your dashboard</p>
        <button onclick="closePopup()">Continue</button>
    </div>
</div>

<script>
function showPopup(message, color) {
    let popup = document.getElementById("popup");
    popup.innerText = message;
    popup.style.background = color;
    popup.style.display = "block";

    setTimeout(() => {
        popup.style.display = "none";
    }, 3000);
}

function validateForm() {
    let user = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let pass = document.getElementById("password").value.trim();
    let otp = document.getElementById("otp").value.trim();

    if (!user || !email || !pass || !otp) {
        showPopup("All fields are required!", "red");
        return false;
    }

    if (!email.includes("@")) {
        showPopup("Enter valid email!", "orange");
        return false;
    }

    if (pass.length < 6) {
        showPopup("Password must be at least 6 characters!", "orange");
        return false;
    }

    // Demo credentials
    if (user === "Admin" && pass === "123456" && otp === "0000") {
        document.getElementById("successPopup").style.display = "flex";
        return false;
    } else {
        showPopup("Invalid Credentials or OTP!", "red");
        return false;
    }
}

function closePopup() {
    document.getElementById("successPopup").style.display = "none";
}
</script>

</body>
</html>
